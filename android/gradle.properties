# Mesin ini hanya 7 GB RAM dan build dengan -Xmx8G membuat daemon Kotlin mati
# di tengah compileDebugKotlin ("Could not close incremental caches") sambil
# ber-swapping sampai >1 jam. Angkanya disesuaikan agar muat.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=2
# Inkremental Kotlin menyimpan .tab cache per modul; di mesin yang kehabisan
# memori file-nya gagal ditutup dan build berikutnya ikut gagal.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
